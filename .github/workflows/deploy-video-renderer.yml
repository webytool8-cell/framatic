# Builds the video renderer image and deploys it as a Google Cloud Run Job.
# Runs on demand and whenever video code changes on main.
#
# Repository secrets: GCP_PROJECT_ID, GCP_DEPLOY_KEY (service-account JSON),
#                     SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Optional variable:  GCP_REGION (default us-central1)
# See docs/gcp/SETUP.md.
name: Deploy video renderer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/video/**"
      - "renderer/**"
      - "public/audio/**"
      - "remotion.config.ts"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: deploy-video-renderer
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  JOB: framatic-renderer
  REPO: framatic

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check Google Cloud settings
        id: cfg
        env:
          HAS_KEY: ${{ secrets.GCP_DEPLOY_KEY != '' && secrets.GCP_PROJECT_ID != '' && secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Google Cloud secrets aren't set yet, so nothing was deployed. See docs/gcp/SETUP.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.ready == 'true'
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cfg.outputs.ready == 'true'

      - name: Prepare project
        if: steps.cfg.outputs.ready == 'true'
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com --quiet || true
          gcloud artifacts repositories describe "$REPO" --location="$REGION" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$REPO" --repository-format=docker --location="$REGION" --description="Framatic images"

      - name: Check Supabase secrets
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ok=true
          case "$SUPABASE_URL" in
            https://*.supabase.co|https://*.supabase.co/) ;;
            *) echo "::error::SUPABASE_URL should look like https://abcdefgh.supabase.co (your Supabase Project URL). Fix it under Settings → Secrets and variables → Actions."; ok=false ;;
          esac
          if printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | grep -q '[{}" ]' || [ ${#SUPABASE_SERVICE_ROLE_KEY} -lt 30 ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY doesn't look like a Supabase key. It should be the secret key (sb_secret_…) or the legacy service_role key (starts with eyJ…), not a Google JSON file."
            ok=false
          fi
          [ "$ok" = true ] || exit 1

      - name: Build image
        if: steps.cfg.outputs.ready == 'true'
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPO/renderer:${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          # Submit without streaming logs (streaming needs project Viewer),
          # then poll the build status, which Cloud Build Editor can read.
          BUILD_ID=$(gcloud builds submit --config renderer/cloudbuild.yaml --substitutions=_IMAGE="$IMAGE" --async --format='value(id)' .)
          echo "Cloud Build: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ secrets.GCP_PROJECT_ID }}"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format='value(status)')
            case "$STATUS" in
              SUCCESS) echo "Build succeeded"; break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Cloud Build finished with status $STATUS. Open the Cloud Build link above for the log."
                gcloud builds describe "$BUILD_ID" --format='value(failureInfo.detail)' || true
                exit 1 ;;
              *) echo "Build status: $STATUS"; sleep 20 ;;
            esac
          done

      - name: Deploy Cloud Run job
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Write env vars to a YAML file so special characters can't break flag parsing.
          ENV_FILE="$RUNNER_TEMP/job-env.yaml"
          python3 - "$ENV_FILE" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w") as f:
              for k in ("SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY"):
                  f.write(f"{k}: {json.dumps(os.environ[k].strip().rstrip('/'))}\n")
          PY
          gcloud run jobs deploy "$JOB" \
            --image="$IMAGE" \
            --region="$REGION" \
            --tasks=1 --max-retries=1 --task-timeout=900s \
            --cpu=4 --memory=8Gi \
            --env-vars-file="$ENV_FILE" \
            --quiet
          rm -f "$ENV_FILE"

      - name: Summary
        if: steps.cfg.outputs.ready == 'true'
        run: |
          {
            echo "## Video renderer deployed"
            echo ""
            echo "- Job: \`$JOB\` in \`$REGION\`"
            echo "- Image: \`$IMAGE\`"
            echo ""
            echo "In Vercel set \`GCP_PROJECT_ID\`, \`GCP_REGION=$REGION\` and \`GCP_SERVICE_ACCOUNT_KEY\`, then redeploy."
          } >> "$GITHUB_STEP_SUMMARY"
